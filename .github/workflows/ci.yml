name: Moni CI Pipeline

on:
  push:
    branches: [ main, V1.1 ]
  pull_request:
    branches: [ main, V1.1 ]

jobs:
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/moni_test"
          DEPLOYMENT_MODE: "single_user"
