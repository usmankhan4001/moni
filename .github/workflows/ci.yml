name: Moni CI Pipeline

on:
  push:
    branches: [ main, V1.1 ]
  pull_request:
    branches: [ main, V1.1 ]

jobs:
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm test

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/moni_test"
          DEPLOYMENT_MODE: "single_user"
