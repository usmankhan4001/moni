services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-moni_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}@db:5432/${POSTGRES_DB:-moni_db}
      # Safe default: no auth, one auto-provisioned workspace. Set to
      # multi_tenant (and AUTH_SECRET below) only once you've read the
      # "Authentication (multi-tenant mode)" section in README.md.
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-single_user}
      # Required only when DEPLOYMENT_MODE=multi_tenant — the app itself
      # refuses to start sessions without it. See .env.example for how to
      # generate one. Left optional here so single_user mode isn't blocked.
      - AUTH_SECRET=${AUTH_SECRET:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-moni-backups}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - CRON_SECRET=${CRON_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # `expose` alone only reaches sibling containers — it publishes nothing.
    # Dokploy's Traefik therefore needs BOTH of these to route your domain
    # here; without them Traefik matches no router and answers its default
    # `404 page not found` for every request. Note this service joins two
    # networks on purpose: `internal` keeps `db:5432` resolvable, while
    # `dokploy-network` is what Traefik itself is attached to.
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # Matches the apex domain plus every tenant subdomain under it, so a
      # Cloudflare wildcard tunnel (*.yourdomain.com) resolves. `$$` is the
      # Compose escape that emits a literal `$` for the regex anchor.
      - 'traefik.http.routers.moni.rule=Host(`${MONI_DOMAIN:-moni.localhost}`) || HostRegexp(`^.+\.${MONI_DOMAIN:-moni.localhost}$$`)'
      # Cloudflare Tunnel terminates TLS at the edge and reaches the origin
      # over plain HTTP, so route on the `web` entrypoint. If you instead
      # expose this server directly to the internet, switch to
      # `websecure` and add: traefik.http.routers.moni.tls.certresolver=letsencrypt
      - "traefik.http.routers.moni.entrypoints=web"
      - "traefik.http.services.moni.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moni_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-moni_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moni_user} -d ${POSTGRES_DB:-moni_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Deliberately NOT on dokploy-network — Postgres stays unreachable from
    # Traefik and every other Dokploy project on that shared network.
    networks:
      - internal

  # Calls the app's protected cron endpoint once a day to run encrypted
  # workspace backups. Only does anything once BACKUP_ENCRYPTION_KEY,
  # CRON_SECRET, and the R2_* credentials are all set — see .env.example.
  backup-cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      - CRON_SECRET=${CRON_SECRET:-}
    depends_on:
      - app
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          if [ -n "$$CRON_SECRET" ]; then
            curl -fsS -X POST http://app:3000/api/cron/backup \
              -H "Authorization: Bearer $$CRON_SECRET" || true;
          fi
          sleep 86400;
        done
    networks:
      - internal

networks:
  # Private bridge for app <-> db <-> cron. Declaring any `networks:` key on a
  # service opts it out of the implicit default network, so every service must
  # name this one explicitly or hostname resolution between them breaks.
  internal:
  # Created by Dokploy on the host; Traefik lives here. `external: true` means
  # Compose attaches to it rather than trying to create it.
  dokploy-network:
    external: true

volumes:
  postgres_data:
